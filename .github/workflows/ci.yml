# Schnelle Prüfung bei jedem Push und Pull Request: Typprüfung (tsc über JSDoc, jsconfig.json) und die
# Unit-Tests (tests/unit/, ohne Browser und ohne Netz). Die Browser-Tests (npm test) laufen hier nicht: Sie
# rufen die öffentlichen Dienste auf (BRouter, Photon …) und würden brouter.de mit jedem Push belasten.
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 – auf Commit gepinnt (ein verschobenes Tag kann keinen fremden Code einschleusen)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit
        env:
          TZ: Europe/Berlin # Öffnungszeiten und Tageslicht rechnen in Ortszeit wie bei den Nutzern
