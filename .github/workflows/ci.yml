# Schnelle Prüfung bei jedem Push und Pull Request: Typprüfung (tsc über JSDoc, jsconfig.json) und die
# Unit-Tests (tests/unit/, ohne Browser und ohne Netz). Die Browser-Tests (npm test) laufen hier nicht: Sie
# rufen die öffentlichen Dienste auf (BRouter, Photon …) und würden brouter.de mit jedem Push belasten.
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 – auf Commit gepinnt (ein verschobenes Tag kann keinen fremden Code einschleusen)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit
        env:
          TZ: Europe/Berlin # Öffnungszeiten und Tageslicht rechnen in Ortszeit wie bei den Nutzern
