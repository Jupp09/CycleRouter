# Datenauszug Europa für den POI-Cache (siehe scripts/build-poi-extract.mjs und server/extract.mjs).
# Läuft wöchentlich, lädt die Geofabrik-Auszüge der europäischen Länder nacheinander (zusammen gut 30 GB),
# filtert die benötigten Orte und veröffentlicht das Ergebnis als Release „poi-data“. Die Server holen es
# sich von dort (POI_EXTRACT_URL).
name: POI-Daten Europa

on:
  schedule:
    - cron: '23 3 * * 1' # montags früh – Geofabrik aktualisiert die Auszüge nachts
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-poi-extract.mjs
      - js/poiSource.js
      - .github/workflows/poi-extract.yml

permissions:
  contents: write # Release-Dateien hochladen

concurrency:
  group: poi-extract
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 – auf Commit gepinnt (ein verschobenes Tag kann keinen fremden Code einschleusen)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: osmium installieren
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Auszüge laden und aufbereiten
        # Ganz Europa liegt bis zum Schreiben im Speicher (einige Millionen Orte)
        run: node --max-old-space-size=12288 scripts/build-poi-extract.mjs --out dist --work "$RUNNER_TEMP/extract"

      - name: Release „poi-data“ aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view poi-data >/dev/null 2>&1 || gh release create poi-data --prerelease \
            --title "POI-Daten Europa" \
            --notes "Wöchentlicher Datenauszug für den POI-Cache von CycloRouter. Daten © OpenStreetMap-Mitwirkende (ODbL), Auszüge: Geofabrik."
          # Erst das Paket, dann die Beschreibung – Server laden nur, was zur Beschreibung (Prüfsumme) passt
          gh release upload poi-data dist/pois-europe.ndjson.gz --clobber
          gh release upload poi-data dist/pois-europe.json --clobber
